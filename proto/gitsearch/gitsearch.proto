syntax = "proto3";

package gitsearch;

option go_package = "github.com/pradeepitm12/gitsearch/proto/gitsearch;gitsearch";

service GithubSearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string search_term = 1;
  string user = 2;
  string  type = 3; // "code", "repositories", "issues", etc.
}

message SearchResponse {
  repeated Result results = 1;
}

message Result {
  string file_url = 1;
  string repo = 2;
}